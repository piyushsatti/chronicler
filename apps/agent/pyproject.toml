[project]
name = "chronicler-agent"
version = "0.1.0"
description = "Single-worker grounded answer harness for Chronicler"
license = "GPL-2.0-only"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "mcp==2.2.0",
    "transformers==4.57.1",
    "jinja2==3.1.6",
    "lancedb==0.38.0",
    "tokenizers==0.22.2",
    "pyarrow>=16",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "starlette>=0.52",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "pyright>=1.1"]

[project.scripts]
chronicler-agent = "pi.chronicler.agent.worker:main"
chronicler-agent-eval = "pi.chronicler.agent.evaluation:main"
chronicler-archive = "pi.chronicler.archive.server:main"
chronicler-archive-reindex-dev = "pi.chronicler.archive.reindex:main"
chronicler-archive-benchmark = "pi.chronicler.archive.benchmark:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/pi/chronicler/agent",
    "src/pi/chronicler/archive",
    "src/pi/chronicler/qa",
]

[tool.hatch.build.targets.wheel.sources]
"src/pi/chronicler/agent" = "pi/chronicler/agent"
"src/pi/chronicler/archive" = "pi/chronicler/archive"
"src/pi/chronicler/qa" = "pi/chronicler/qa"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "PT011", "E501", "DTZ001", "N806", "F841"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = [
    "src/pi/chronicler/agent",
    "src/pi/chronicler/archive",
    "src/pi/chronicler/qa",
]
extraPaths = ["src"]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
