query MemberMyUpcomingSignups($from: DateTime, $limit: Int! = 100, $offset: Int! = 0) {
  myQuestSignups(scheduledFrom: $from, limit: $limit, offset: $offset) {
    total
    items {
      questId
      status
      characterName
    }
  }
}

query MemberUpcomingQuests($ids: [ID!], $limit: Int! = 100, $offset: Int! = 0) {
  quests(filters: { ids: $ids }, limit: $limit, offset: $offset) {
    total
    items {
      id
      shortCode
      status
      scheduledAt
      briefDocument {
        title
      }
    }
  }
}
