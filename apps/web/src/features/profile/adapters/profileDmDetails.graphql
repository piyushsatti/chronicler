query ProfileDmDetails($memberId: ID!, $limit: Int!, $offset: Int!) {
  dmStats(memberId: $memberId) {
    sessionCount
  }
  documents(
    filters: { kind: "community", category: "dm_table", createdBy: $memberId }
    limit: $limit
    offset: $offset
  ) {
    items {
      id
      slug
      title
      status
      authorId
      canEditBody
      canEditMetadata
    }
    total
  }
}
