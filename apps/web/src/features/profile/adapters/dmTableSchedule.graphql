query DmTableSchedule($memberId: ID!, $limit: Int!, $offset: Int!) {
  quests(filters: { dmId: $memberId }, limit: $limit, offset: $offset) {
    items {
      id
      shortCode
      status
      scheduledAt
      slotsMax
      filledCount
      displayStatus
      briefDocument {
        title
      }
    }
    total
  }
}
