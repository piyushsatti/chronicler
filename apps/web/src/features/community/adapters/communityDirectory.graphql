query CommunityDirectory(
  $filters: CommunityDirectoryFiltersInput
  $limit: Int!
  $offset: Int = 0
) {
  communityDirectory(filters: $filters, limit: $limit, offset: $offset) {
    entries {
      memberId
      handle
      displayName
      tagline
      acceptingPlayers
      isDm
      roles
      avatarUrl
      availableDays
    }
    total
  }
}
