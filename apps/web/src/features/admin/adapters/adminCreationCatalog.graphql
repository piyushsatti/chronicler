query AdminCreationCatalog(
  $limit: Int! = 50
  $offset: Int! = 0
  $kind: String
  $regionId: ID
) {
  creationCatalog(
    filters: { includeAll: true, kind: $kind, regionId: $regionId }
    limit: $limit
    offset: $offset
  ) {
    total
    items {
      id
      kind
      name
      description
      available
      retired
      introducedByRegionId
    }
  }
}
