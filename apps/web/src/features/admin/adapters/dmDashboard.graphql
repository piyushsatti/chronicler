query DmDashboard(
  $memberId: ID!
  $questLimit: Int!
  $questOffset: Int!
  $tableLimit: Int!
  $tableOffset: Int!
) {
  dmStats(memberId: $memberId) {
    sessionCount
  }
  quests(filters: { dmId: $memberId }, limit: $questLimit, offset: $questOffset) {
    total
    items {
      id
      shortCode
      status
      scheduledAt
      slotsMax
      filledCount
      briefDocument {
        title
      }
    }
  }
  documents(
    filters: { kind: "community", category: "dm_table", createdBy: $memberId }
    limit: $tableLimit
    offset: $tableOffset
  ) {
    total
    items {
      id
      slug
      title
      status
      authorId
      canEditMetadata
      canEditBody
    }
  }
}
