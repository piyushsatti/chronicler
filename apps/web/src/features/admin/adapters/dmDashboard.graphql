query DmDashboard(
  $memberId: ID!
  $questLimit: Int!
  $questOffset: Int!
) {
  dmStats(memberId: $memberId) {
    sessionCount
  }
  questArcs(limit: 50, offset: 0) {
    total
    items {
      id
      name
      createdBy
      questCount
    }
  }
  quests(filters: { dmId: $memberId }, limit: $questLimit, offset: $questOffset) {
    total
    items {
      id
      shortCode
      status
      scheduledAt
      slotsMax
      filledCount
      briefDocument {
        title
      }
    }
  }
}
