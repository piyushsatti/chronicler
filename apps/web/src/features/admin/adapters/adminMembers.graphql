query AdminMembers(
  $limit: Int! = 50
  $offset: Int! = 0
  $search: String
  $role: String
  $status: String
) {
  members(
    limit: $limit
    offset: $offset
    filters: { search: $search, role: $role, status: $status }
  ) {
    total
    items {
      id
      handle
      displayName
      roles
      status
      joinedAt
    }
  }
}
