query AdminCharacters(
  $limit: Int! = 50
  $offset: Int! = 0
  $namePrefix: String
  $status: String
  $regionId: ID
) {
  adminCharacterDirectory(
    filters: { namePrefix: $namePrefix, status: $status, regionId: $regionId }
    limit: $limit
    offset: $offset
  ) {
    total
    items {
      id
      shortCode
      name
      ownerHandle
      ownerDisplayName
      status
      verificationStatus
    }
  }
}
