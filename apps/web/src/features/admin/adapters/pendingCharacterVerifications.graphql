query PendingCharacterVerifications($limit: Int! = 50, $offset: Int! = 0) {
  pendingCharacterVerifications(limit: $limit, offset: $offset) {
    total
    items {
      id
      shortCode
      name
      ownerHandle
      ownerDisplayName
      ddbUrl
      verificationSubmittedAt
      ddbSyncedAt
    }
  }
}
