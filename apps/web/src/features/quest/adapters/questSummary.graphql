query QuestSummaryPage($questId: ID!, $offset: Int! = 0) {
  questSummaries(questId: $questId, limit: 50, offset: $offset) {
    summaries {
      id
      slug
      title
      category
      status
      authorId
      canEditBody
      canEditMetadata
      effectiveBody
    }
    totals {
      totalPcxpAwarded
      coverage
    }
  }
}
