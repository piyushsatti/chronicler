query Quest($id: ID, $shortCode: String) {
  quest(id: $id, shortCode: $shortCode) {
    id
    shortCode
    status
    dmId
    updatedAt
    arcId
    arc {
      id
      name
    }
    scheduledAt
    durationHours
    slotsMax
    filledCount
    displayStatus
    genres
    tags
    dm {
      handle
      displayName
    }
    briefDocument {
      id
      slug
      title
      effectiveBody
      frontmatter
    }
    discordDelivery {
      desiredRevision
      appliedRevision
      overallStatus
      nextRetryAt
      errorMessage
    }
    participants {
      memberId
      characterId
      characterName
      memberHandle
      status
    }
    pointcrawlLinks(limit: 100) {
      pointcrawlNodeId
      role
    }
  }
}
