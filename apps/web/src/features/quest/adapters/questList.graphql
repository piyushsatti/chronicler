query QuestList($filters: QuestFiltersInput!, $limit: Int!, $offset: Int!) {
  quests(filters: $filters, limit: $limit, offset: $offset) {
    total
    items {
      id
      shortCode
      status
      scheduledAt
      slotsMax
      filledCount
      displayStatus
      tags
      regions
      dm {
        handle
        displayName
        avatarUrl
      }
      briefDocument {
        id
        slug
        title
        effectiveBody
      }
      participants(limit: 100) {
        memberId
        characterId
        characterName
        memberHandle
        memberAvatarUrl
        status
      }
      discordDelivery {
        desiredRevision
        appliedRevision
        overallStatus
        nextRetryAt
        errorMessage
      }
    }
  }
}
