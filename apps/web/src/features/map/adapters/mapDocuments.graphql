query MapDocuments($id0: ID!, $id1: ID!, $id2: ID!, $id3: ID!, $id4: ID!) {
  document0: documentById(id: $id0) {
    ...MapDocumentFields
  }
  document1: documentById(id: $id1) {
    ...MapDocumentFields
  }
  document2: documentById(id: $id2) {
    ...MapDocumentFields
  }
  document3: documentById(id: $id3) {
    ...MapDocumentFields
  }
  document4: documentById(id: $id4) {
    ...MapDocumentFields
  }
}
fragment MapDocumentFields on DocumentType {
  id
  slug
  kind
  category
  title
  effectiveBody
}
