query Search($query: String!, $kinds: [String!], $limit: Int!, $offset: Int!) {
  search(query: $query, kinds: $kinds, limit: $limit, offset: $offset) {
    query
    documentTotal
    documentOrder
    memberTotal
    memberOrder
    documents {
      id
      kind
      category
      slug
      title
      snippet
      questShortCode
    }
    members {
      memberId
      handle
      displayName
      avatarUrl
    }
  }
}
