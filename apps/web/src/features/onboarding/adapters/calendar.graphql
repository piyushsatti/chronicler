query RetainedCalendar($realFrom: Date!, $realTo: Date!, $selectedDate: Date!) {
  gameCalendar(realFrom: $realFrom, realTo: $realTo) {
    currentGameDay
    currentGameDate {
      eraAbbrev
      year
      periodName
      periodIndex
      periodType
      day
    }
    monthGrid {
      realDate
      gameDay
      gameDate {
        eraAbbrev
        year
        periodName
        periodIndex
        periodType
        day
      }
    }
  }
  gameDate(realDate: $selectedDate) {
    eraAbbrev
    year
    periodName
    periodIndex
    periodType
    day
  }
}
