query RetainedSeriesArc($id: ID!, $offset: Int!) {
  questArc(id: $id) {
    id
    name
    createdBy
    createdAt
    questCount
    quests(limit: 50, offset: $offset) {
      id
      shortCode
      status
      displayStatus
      scheduledAt
      slotsMax
      dm {
        handle
        displayName
      }
      briefDocument {
        title
        effectiveBody
      }
      participants(limit: 100) {
        characterId
        characterName
        memberAvatarUrl
        status
      }
    }
  }
}
