query ChronicleList($limit: Int!, $offset: Int!, $realFrom: Date!, $realTo: Date!) {
  gameCalendar(realFrom: $realFrom, realTo: $realTo) {
    definition
  }
  documents(
    filters: { kind: "summary", status: "published" }
    limit: $limit
    offset: $offset
  ) {
    items {
      id
      slug
      category
      title
      effectiveBody
      frontmatter
      author {
        handle
      }
      updatedAt
      publishedAt
      summaryDerived {
        regions {
          id
          name
        }
        dms {
          id
          displayName
        }
        occurredAt
        arc
        gameDay
        gameDate {
          eraAbbrev
          year
          periodName
          periodIndex
          periodType
          day
        }
      }
    }
    total
  }
}
