query ChronicleList($limit: Int!) {
  documents(filters: { kind: "summary", status: "published" }, limit: $limit) {
    items {
      id
      slug
      category
      title
      frontmatter
      author {
        handle
      }
      updatedAt
      summaryDerived {
        regions {
          id
          name
        }
        dms {
          id
          displayName
        }
        occurredAt
        arc
        gameDay
        gameDate {
          eraAbbrev
          year
          periodName
          periodIndex
          periodType
          day
        }
      }
    }
    total
  }
}
