query CodexEntry($slug: String!) {
  codexEntry(slug: $slug) {
    backlinkCount
    document {
      id
      slug
      kind
      category
      status
      visibility
      title
      effectiveBody
      updatedAt
      canEditBody
      canEditMetadata
      author {
        handle
      }
    }
  }
  documentBacklinks(slug: $slug, limit: 12) {
    documentId
    relation
  }
}
