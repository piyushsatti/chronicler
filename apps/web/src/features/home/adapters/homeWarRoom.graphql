query HomeWarRoom(
  $upcomingFrom: DateTime!
  $upcomingTo: DateTime!
  $closedSince: DateTime!
) {
  questBoard(limit: 12) {
    items {
      id
      shortCode
      status
      scheduledAt
      slotsMax
      filledCount
      displayStatus
      tags
      regions
      dm {
        handle
        displayName
        avatarUrl
      }
      briefDocument {
        id
        slug
        title
        effectiveBody
      }
      participants(limit: 100) {
        memberId
        characterId
        characterName
        memberHandle
        memberAvatarUrl
        status
      }
      discordDelivery {
        desiredRevision
        appliedRevision
        overallStatus
      }
    }
    total
  }
  quests(
    filters: { scheduledFrom: $upcomingFrom, scheduledTo: $upcomingTo }
    limit: 12
  ) {
    items {
      id
      shortCode
      status
      scheduledAt
      slotsMax
      filledCount
      displayStatus
      tags
      regions
      dm {
        handle
        displayName
        avatarUrl
      }
      briefDocument {
        id
        slug
        title
        effectiveBody
      }
      participants(limit: 100) {
        memberId
        characterId
        characterName
        memberHandle
        memberAvatarUrl
        status
      }
      discordDelivery {
        desiredRevision
        appliedRevision
        overallStatus
      }
    }
    total
  }
  recentlyClosedQuests(closedSince: $closedSince, limit: 12) {
    items {
      id
      shortCode
      status
      scheduledAt
      slotsMax
      filledCount
      displayStatus
      tags
      regions
      dm {
        handle
        displayName
        avatarUrl
      }
      briefDocument {
        id
        slug
        title
        effectiveBody
      }
      participants(limit: 100) {
        memberId
        characterId
        characterName
        memberHandle
        memberAvatarUrl
        status
      }
      discordDelivery {
        desiredRevision
        appliedRevision
        overallStatus
      }
    }
    total
  }
  communityDirectory(filters: { acceptingPlayers: true, role: "dm" }, limit: 12) {
    entries {
      memberId
      handle
      displayName
      tagline
      acceptingPlayers
      isDm
    }
    total
  }
  regions(limit: 200) {
    id
    name
  }
}
