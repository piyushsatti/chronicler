query EditorQuestLoad($id: ID, $shortCode: String) {
  quest(id: $id, shortCode: $shortCode) {
    id
    shortCode
    scheduledAt
    durationHours
    slotsMax
    kinds
    genres
    tags
    apl
    signupType
    voiceChannelId
    regions
    updatedAt
    briefDocument {
      id
      slug
      title
      status
      version
      canEditMetadata
      canEditBody
      frontmatter
      effectiveBody
    }
  }
}
