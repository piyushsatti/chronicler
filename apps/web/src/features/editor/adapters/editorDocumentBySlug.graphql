query EditorDocumentBySlug($slug: String!) {
  document(slug: $slug) {
    id
    slug
    kind
    category
    title
    status
    version
    canEditMetadata
    canEditBody
    visibility
    policy
    readerIds
    authorId
    frontmatter
    effectiveBody
    summaryDerived {
      authoring {
        questIds
        characterId
        complete
      }
      quests {
        id
        shortCode
        title
      }
    }
  }
}
