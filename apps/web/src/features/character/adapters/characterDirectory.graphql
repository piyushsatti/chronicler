query CharacterDirectory($filters: CharacterFiltersInput, $limit: Int!, $offset: Int!) {
  characters(filters: $filters, limit: $limit, offset: $offset) {
    items {
      id
      shortCode
      name
      status
      ownerId
      verificationStatus
      backstoryId
      regionId
      description
      ddbUrl
      imageUrl
      displayIcon
      updatedAt
      pcxp
      verificationSubmittedAt
      ddbMirror {
        level
        xp
        classes
        species
        background
        syncedAt
      }
    }
    total
  }
}
