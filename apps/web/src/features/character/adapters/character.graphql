query Character($id: ID, $shortCode: String) {
  character(id: $id, shortCode: $shortCode) {
    id
    shortCode
    name
    status
    ownerId
    verificationStatus
    backstoryId
    regionId
    description
    ddbUrl
    imageUrl
    displayIcon
    updatedAt
    pcxp
    daysActive
    verificationSubmittedAt
    ddbMirror {
      level
      xp
      classes
      species
      background
      syncedAt
    }
  }
}
