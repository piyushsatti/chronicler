query RuleDetail($slug: String!) {
  document(slug: $slug) {
    id
    slug
    kind
    category
    status
    visibility
    title
    effectiveBody
    updatedAt
    canEditBody
    canEditMetadata
    author {
      handle
    }
  }
  documentBacklinks(slug: $slug, limit: 100) {
    documentId
  }
}
