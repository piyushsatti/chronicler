<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Keep first paint aligned with context/theme.utils.ts. This bootstrap
      // reads the existing preference record; runtime helpers own persistence.
      (function () {
        var mode = 'system';
        var theme = 'parchment';
        var colorblindSafe = false;
        var bgEffect = 'none';
        var reducedMotion = false;
        var density = 'comfortable';
        try {
          var key = 'chronicler-prefs';
          try {
            var token = localStorage.getItem('chronicler_auth_token');
            if (token) {
              var payload = JSON.parse(
                atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')),
              );
              if (
                typeof payload.member_id === 'string' &&
                payload.member_id &&
                typeof payload.exp === 'number' &&
                payload.exp * 1000 > Date.now()
              ) {
                key += ':' + encodeURIComponent(payload.member_id);
              }
            }
          } catch (_tokenError) {
            /* Invalid sessions use guest preferences. */
          }
          var raw = localStorage.getItem(key);
          if (raw) {
            var prefs = JSON.parse(raw);
            // Null records fall back as a whole, matching loadPrefs().
            if (prefs === null) throw new Error('Invalid preference record');
            if (['dark', 'light', 'system'].indexOf(prefs.mode) !== -1) {
              mode = prefs.mode;
            }
            if (
              [
                'parchment',
                'midnight',
                'ember',
                'dracula',
                'vegan',
                'atlas',
                'default',
              ].indexOf(prefs.theme) !== -1
            ) {
              theme = prefs.theme;
            }
            colorblindSafe = prefs.colorblindSafe === true;
            reducedMotion = prefs.reducedMotion === true;
            density = prefs.density === 'compact' ? 'compact' : 'comfortable';
            if (
              ['none', 'starfield-twinkle', 'glow-pulse', 'gradient-sweep'].indexOf(
                prefs.bgEffect,
              ) !== -1
            ) {
              bgEffect = prefs.bgEffect;
            }
          }
        } catch (_error) {
          // Invalid records and blocked storage both use the runtime defaults.
          mode = 'system';
          theme = 'parchment';
          colorblindSafe = false;
          bgEffect = 'none';
          reducedMotion = false;
          density = 'comfortable';
        }
        var systemMode = 'dark';
        if (window.matchMedia) {
          systemMode = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        }
        var resolvedMode = mode === 'system' ? systemMode : mode;
        var root = document.documentElement;
        root.setAttribute('data-mode', resolvedMode);
        root.setAttribute('data-mode-pref', mode);
        root.setAttribute('data-theme', theme);
        root.setAttribute('data-colorblind', colorblindSafe ? 'safe' : 'off');
        root.setAttribute('data-bg-effect', bgEffect);
        root.setAttribute('data-density', density);
        root.setAttribute(
          'data-motion-collapse',
          reducedMotion ||
            (window.matchMedia &&
              window.matchMedia('(prefers-reduced-motion: reduce)').matches)
            ? 'on'
            : 'off',
        );
        root.style.colorScheme = resolvedMode;
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link rel="icon" type="image/webp" href="/lc-logo.webp" />
    <link
      rel="preload"
      href="/fonts/lato-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/fraunces-latin-full-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Chronicler</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
