{
  'schema': ['../../packages/contracts/graphql/**/*.graphql'],
  'exec': { 'package': 'graph', 'filename': 'internal/graph/generated.go' },
  'model': { 'package': 'graph', 'filename': 'internal/graph/models_gen.go' },
  'resolver':
    {
      'package': 'graph',
      'layout': 'follow-schema',
      'dir': 'internal/graph',
      'filename_template': '{name}.resolvers.go',
    },
  'models':
    {
      'ID':
        {
          'model':
            [
              'github.com/piyushsatti/chronicler/apps/api/internal/platform/graphql/scalars.ID',
            ],
        },
      'Date':
        {
          'model':
            [
              'github.com/piyushsatti/chronicler/apps/api/internal/platform/graphql/scalars.Date',
            ],
        },
      'Time':
        {
          'model':
            [
              'github.com/piyushsatti/chronicler/apps/api/internal/platform/graphql/scalars.Time',
            ],
        },
      'DateTime':
        {
          'model':
            [
              'github.com/piyushsatti/chronicler/apps/api/internal/platform/graphql/scalars.DateTime',
            ],
        },
      'JSON':
        {
          'model':
            [
              'github.com/piyushsatti/chronicler/apps/api/internal/platform/graphql/scalars.JSON',
            ],
        },
      'Int': { 'model': ['github.com/99designs/gqlgen/graphql.Int'] },
      'AdminOperationsType': { 'fields': { 'activeAlerts': { 'resolver': true } } },
      'CodexEntryCardType': { 'fields': { 'subjects': { 'resolver': true } } },
      'DocumentType':
        {
          'fields':
            {
              'author': { 'resolver': true },
              'summaryDerived': { 'resolver': true },
              'policy': { 'resolver': true },
              'readerIds': { 'resolver': true },
            },
        },
      'GameCalendarType': { 'fields': { 'currentGameDate': { 'resolver': true } } },
      'MapType':
        {
          'fields':
            {
              'pointcrawlEdges': { 'resolver': true },
              'pointcrawlNodes': { 'resolver': true },
            },
        },
      'MemberActivityStatsType':
        {
          'fields':
            {
              'recentSessions': { 'resolver': true },
              'voiceByChannel': { 'resolver': true },
            },
          'extraFields':
            { 'MemberID': { 'type': 'string', 'overrideTags': 'json:"-"' } },
        },
      'MemberProfileType': { 'fields': { 'recentWeeks': { 'resolver': true } } },
      'PointcrawlNodeType': { 'fields': { 'linkedEntries': { 'resolver': true } } },
      'QuestArcType': { 'fields': { 'quests': { 'resolver': true } } },
      'QuestType':
        {
          'fields':
            {
              'arc': { 'resolver': true },
              'briefDocument': { 'resolver': true },
              'discordDelivery': { 'resolver': true },
              'dm': { 'resolver': true },
              'dmTable': { 'resolver': true },
              'participants': { 'resolver': true },
              'pointcrawlLinks': { 'resolver': true },
            },
        },
      'MemberType': { 'fields': { 'discordId': { 'resolver': true } } },
      'DocumentEditInput':
        {
          'fields':
            {
              'body': { 'omittable': true },
              'category': { 'omittable': true },
              'frontmatter': { 'omittable': true },
              'title': { 'omittable': true },
            },
        },
      'MemberSettingsPatch':
        {
          'fields':
            {
              'colorblindSafe': { 'omittable': true },
              'density': { 'omittable': true },
              'effectsEnabled': { 'omittable': true },
              'mode': { 'omittable': true },
              'notifyCharacterVerification': { 'omittable': true },
              'notifyDmMentioned': { 'omittable': true },
              'notifyDmRequestDecided': { 'omittable': true },
              'notifyDocumentActivity': { 'omittable': true },
              'notifyQuestScheduled': { 'omittable': true },
              'notifyQuestSignup': { 'omittable': true },
              'reducedMotion': { 'omittable': true },
              'theme': { 'omittable': true },
              'timezone': { 'omittable': true },
            },
        },
      'QuestEditInput':
        {
          'fields':
            {
              'additionalInfo': { 'omittable': true },
              'apl': { 'omittable': true },
              'arcId': { 'omittable': true },
              'briefBody': { 'omittable': true },
              'dmId': { 'omittable': true },
              'durationHours': { 'omittable': true },
              'genres': { 'omittable': true },
              'kinds': { 'omittable': true },
              'regionIds': { 'omittable': true },
              'scheduledAt': { 'omittable': true },
              'signupType': { 'omittable': true },
              'slotsMax': { 'omittable': true },
              'tags': { 'omittable': true },
              'title': { 'omittable': true },
            },
        },
      'UpdateCharacterProfileInput':
        {
          'fields':
            {
              'backgroundText': { 'omittable': true },
              'description': { 'omittable': true },
            },
        },
      'UpdateMyProfileInput': { 'fields': { 'avatarUrl': { 'omittable': true } } },
    },
}
