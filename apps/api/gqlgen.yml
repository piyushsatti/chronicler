schema:
  - ../../packages/contracts/graphql/*.graphql

exec:
  package: graph
  filename: internal/graph/generated.go

model:
  package: graph
  filename: internal/graph/models_gen.go

resolver:
  package: graph
  layout: follow-schema
  dir: internal/graph

models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
  DateTime:
    model:
      - github.com/99designs/gqlgen/graphql.Time
  Date:
    model:
      - github.com/99designs/gqlgen/graphql.Time
  JSON:
    model:
      - github.com/99designs/gqlgen/graphql.Map
  Int:
    model:
      - github.com/99designs/gqlgen/graphql.Int
  QuestV2Type:
    fields:
      participants:
        resolver: true
      briefDocument:
        resolver: true
      dm:
        resolver: true
  DocumentType:
    fields:
      author:
        resolver: true
