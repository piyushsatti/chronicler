version: '2'

run:
  timeout: 3m

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - gocyclo
    - gocognit
    - funlen
    - ineffassign
    - unused
    - forbidigo
  settings:
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 20
    funlen:
      lines: 80
      statements: 50
    revive:
      rules:
        - name: exported
          disabled: true
    forbidigo:
      forbid:
        - pattern: os\.Getenv|os\.LookupEnv
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - funlen
          - gocyclo
          - gocognit
          - forbidigo
      - path: internal/platform/config/
        linters:
          - forbidigo
      - path: internal/platform/dbtest/
        linters:
          - forbidigo
      - path: cmd/seedqa/
        linters:
          - forbidigo
    paths:
      - third_party$
      - builtin$
      - examples$
