name: Bug report
description: Something on the site or the Discord bot doesn't work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't paste passwords, tokens, or other people's personal information.
        Found a security problem? Use "Report a security problem" on the previous page instead of a public issue.
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - Website
        - Discord bot
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen again
      placeholder: |
        1.
        2.
        3.
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
  - type: input
    id: when
    attributes:
      label: When did it happen?
      placeholder: e.g. 2026-11-06 18:30 EST
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or extra details
      description: You can drag images into this box.
