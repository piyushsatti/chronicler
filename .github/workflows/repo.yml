name: repo

on:
  push:
    # Only main: PR branches are covered by pull_request, and staging tags point
    # at commits that already passed.
    branches: [main]
    paths:
      - '.github/workflows/repo.yml'
      - '.github/CODEOWNERS'
      - '.pre-commit-config.yaml'
      - '.prettierignore'
      - 'prettier.config.js'
      - 'eslint.config.js'
      - 'package.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/**'
      - 'docs/**'
      - 'deploy/docs/**'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'AGENTS.md'
  pull_request:

jobs:
  tooling:
    # Self-hosted Triton runners (no GitHub minutes), fresh container per job.
    # Dependabot PRs stay on GitHub-hosted runners.
    runs-on: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && 'ubuntu-latest' || 'triton' }}
    container:
      image: buildpack-deps:noble
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@v5
      - name: Install JS tooling
        run: bun install --frozen-lockfile
      - name: Sync Python dev tools
        run: uv sync --frozen --group dev
      - name: Verify repo tooling
        run: bash scripts/verify-repo
