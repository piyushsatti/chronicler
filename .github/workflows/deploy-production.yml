name: deploy-production

# Production release: push a CalVer tag such as `2026.10.31` or `2026.10.31.2`
# on a commit that is on `main` (D33: releases run only through GitHub Actions;
# D51: one VM, Cloudflare Tunnel, Supabase PostgreSQL). The steps live in
# deploy-release.yml, shared with staging. The backend deploys to the
# production VM's self-hosted runner with Docker Compose, using the hosted
# database in DATABASE_URL and the Cloudflare Tunnel container; the frontend
# deploys to the Vercel production project. Required environment values: see
# deploy-release.yml.

on:
  push:
    # Filter patterns are globs, not regexes; the reusable workflow's tag_pattern
    # is the strict check.
    tags:
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]'
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].[0-9]*'

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-release.yml
    with:
      environment: production
      # The runner is registered with --no-default-labels, like the CI runners, so
      # a job asking only for `self-hosted` can never land on it.
      runner_labels: '["chronicler-production"]'
      tag_pattern: '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$'
      tag_format: YYYY.MM.DD or YYYY.MM.DD.N
      require_main: true
      project: chronicler-production
      api_port: '8080'
      api_domain: chronicler-prod-api.piyushsatti.com
      other_api_domain: chronicler-api.piyushsatti.com
      cors_origins: https://chronicler.smokebombstudios.com
      discord_redirect_uri: https://chronicler.smokebombstudios.com/auth/callback
      local_database: false
      tunnel: true
      vercel_config: apps/web/vercel.json
    secrets: inherit
