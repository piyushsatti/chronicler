name: agent

on:
  push:
    # Only main: PR branches are covered by pull_request, and staging tags point
    # at commits that already passed.
    branches: [main]
    paths:
      - '.github/workflows/agent.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'apps/agent/**'
      - 'packages/contracts/openapi.yaml'
  pull_request:

jobs:
  agent:
    # Self-hosted Triton runners (no GitHub minutes), fresh container per job.
    # Dependabot PRs stay on GitHub-hosted runners.
    runs-on: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && 'ubuntu-latest' || 'triton' }}
    container:
      image: buildpack-deps:noble
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Sync root tooling
        run: uv sync --frozen --all-groups
      - name: Sync agent
        run: uv sync --directory apps/agent --frozen --all-groups
      - name: Ruff
        run: uv run --directory apps/agent ruff check . && uv run ruff format --check apps/agent
      - name: Pyright
        run: uv run --directory apps/agent pyright
      - name: Pytest
        run: uv run --directory apps/agent pytest -q
