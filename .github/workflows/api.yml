name: api

on:
  push:
    paths:
      - 'apps/api/**'
      - 'packages/contracts/**'
      - 'scripts/merge-graphql-schema'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'packages/contracts/**'
      - 'scripts/merge-graphql-schema'
      - '.github/workflows/api.yml'

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    # Integration tests own Postgres via testcontainers (Docker on the runner).
    # No pre-started DATABASE_URL service.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: apps/api/go.sum
      - name: Merge GraphQL schema
        working-directory: .
        run: bash scripts/merge-graphql-schema
      - name: Schema drift
        working-directory: .
        run: git diff --exit-code -- packages/contracts/schema.graphql
      - name: Install codegen tools
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          go install github.com/99designs/gqlgen@v0.17.78
      - name: sqlc drift
        run: sqlc generate && git diff --exit-code -- internal/platform/dbgen
      - name: gqlgen drift
        run: gqlgen generate && git diff --exit-code -- internal/graph
      - name: Download modules
        run: go mod download
      - name: Vet
        run: go vet ./...
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install JS workspace (discord sensor tests)
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Verify loop (unit, contract, integration via testcontainers, discord sensor)
        run: bash scripts/verify-loop.sh
        env:
          # Force testcontainers; do not reuse a host DB in CI.
          DATABASE_URL: ''
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          working-directory: apps/api
      - name: Build
        run: go build -o /tmp/chronicler-api ./cmd/api && go build -o /tmp/chronicler-worker ./cmd/worker
