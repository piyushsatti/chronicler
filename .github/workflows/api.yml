name: api

on:
  push:
    paths:
      - "apps/api/**"
      - "packages/contracts/**"
      - "scripts/merge-graphql-schema"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/contracts/**"
      - "scripts/merge-graphql-schema"
      - ".github/workflows/api.yml"

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chronicler
          POSTGRES_PASSWORD: chronicler
          POSTGRES_DB: chronicler
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chronicler"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://chronicler:chronicler@localhost:5432/chronicler?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: apps/api/go.sum
      - name: Merge GraphQL schema
        working-directory: .
        run: bash scripts/merge-graphql-schema
      - name: Schema drift
        working-directory: .
        run: git diff --exit-code -- packages/contracts/schema.graphql
      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.24.1
      - name: Migrate
        run: bash scripts/migrate.sh up
      - name: Seed
        run: psql "$DATABASE_URL" -f db/seed/local.sql
      - name: Install codegen tools
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.29.0
          go install github.com/99designs/gqlgen@v0.17.78
      - name: sqlc drift
        run: sqlc generate && git diff --exit-code -- internal/platform/dbgen
      - name: gqlgen drift
        run: gqlgen generate && git diff --exit-code -- internal/graph
      - name: Download modules
        run: go mod download
      - name: Vet
        run: go vet ./...
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install JS workspace (discord sensor tests)
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Verify loop (unit, contract, integration, discord sensor)
        run: bash scripts/verify-loop.sh
      - name: Document integration extras
        run: go test -tags=integration ./internal/document/...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          working-directory: apps/api
      - name: Build
        run: go build -o /tmp/chronicler-api ./cmd/api && go build -o /tmp/chronicler-worker ./cmd/worker
