name: api

on:
  push:
    # Only main: PR branches are covered by pull_request, and staging tags point
    # at commits that already passed.
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/web/src/**/*.graphql'
      - 'packages/contracts/**'
      - 'scripts/merge-graphql-schema'
      - '.github/workflows/api.yml'
  pull_request:

jobs:
  go:
    # Self-hosted Triton runners (no GitHub minutes). Dependabot PRs stay on
    # GitHub-hosted runners.
    runs-on: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && 'ubuntu-latest' || 'triton' }}
    # Fresh container per job. Integration tests own Postgres via
    # testcontainers, so the job talks to the host Docker through its socket.
    # No pre-started DATABASE_URL service.
    container:
      image: buildpack-deps:noble
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: apps/api/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install JS workspace (discord sensor tests)
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Merge GraphQL schema
        working-directory: .
        run: bash scripts/merge-graphql-schema
      - name: Schema drift
        working-directory: .
        run: git diff --exit-code -- packages/contracts/schema.graphql
      - name: Install codegen tools
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          go install github.com/99designs/gqlgen@v0.17.78
      - name: sqlc drift
        run: sqlc generate && git diff --exit-code -- internal/platform/dbgen
      - name: gqlgen drift
        run: gqlgen generate && git diff --exit-code -- internal/graph
      - name: Download modules
        run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Verify loop (unit, contract, integration via testcontainers, discord sensor)
        run: bash scripts/verify-loop.sh
        env:
          # Force testcontainers; do not reuse a host DB in CI.
          DATABASE_URL: ''
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          working-directory: apps/api
      - name: Build
        run: go build -o /tmp/chronicler-api ./cmd/api && go build -o /tmp/chronicler-worker ./cmd/worker
