name: deploy-staging

# Staging release: push a tag such as `staging-2026.10.25.1` (D33: releases run
# only through GitHub Actions). The steps live in deploy-release.yml, shared with
# production (D51). The backend deploys to the owner's self-hosted runner with
# Docker Compose and its own PostgreSQL; the frontend deploys to the Vercel
# staging project. Staging keeps the tunnel on its host, so the Compose tunnel
# profile stays off. Required environment values: see deploy-release.yml.

on:
  push:
    tags: ['staging-*']

concurrency:
  group: staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-release.yml
    with:
      environment: staging
      runner_labels: '["self-hosted", "chronicler-staging"]'
      tag_pattern: '^staging-[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$'
      tag_format: staging-YYYY.MM.DD.N
      project: chronicler-staging
      api_port: '8081'
      api_domain: chronicler-api.piyushsatti.com
      other_api_domain: chronicler-prod-api.piyushsatti.com
      cors_origins: https://chronicler.piyushsatti.com
      discord_redirect_uri: https://chronicler.piyushsatti.com/auth/callback
      local_database: true
      tunnel: false
      vercel_config: apps/web/vercel.staging.json
    secrets: inherit
