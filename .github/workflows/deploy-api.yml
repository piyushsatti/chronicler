name: deploy-api

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production

# Production promotions run only through this workflow (D33).

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: apps/api/go.sum
      - name: Test
        working-directory: apps/api
        run: go test ./...
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push api image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/api
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:${{ inputs.environment }}-latest" apps/api
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:${{ inputs.environment }}-latest"
      - name: Build and push discord bot image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/discord
          docker build -f apps/discord/Dockerfile -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:${{ inputs.environment }}-latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:${{ inputs.environment }}-latest"
      - name: Summary
        run: |
          echo "Pushed api and discord images for ${{ inputs.environment }} at ${{ github.sha }}."
          echo "Images only; this workflow does not deploy or migrate (see deploy/docs/deploy-runbook.md)."
