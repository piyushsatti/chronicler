type CodexDirectoryResult {
  items: [DocumentType!]!
  total: Int!
}

type CodexEntryCardType {
  document: DocumentType!
  backlinkCount: Int!
  subjects(limit: Int! = 50, offset: Int! = 0): [DocumentLinkType!]!
}

type DocumentAuthorType {
  handle: String!
}

input DocumentFiltersInput {
  kind: String = null
  category: String = null
  status: String = null
  visibility: String = null
  search: String = null
  region: String = null
  createdBy: ID = null
}

type DocumentLinkType {
  documentId: ID!
  targetType: String!
  targetId: ID!
  relation: String!
}

type DocumentListResult {
  items: [DocumentType!]!
  total: Int!
}

type DocumentRevisionType {
  reason: String!
  recordedAt: DateTime!
  recordedBy: ID
  id: ID!
  documentId: ID!
  rev: Int!
  title: String!
  frontmatter: JSON!
  body: String!
  visibility: String
  publishedAt: DateTime
  publishedBy: ID
}

type DocumentSearchHitType {
  id: ID!
  kind: String!
  category: String
  slug: String!
  title: String!
  snippet: String!
  questShortCode: String
}

type DocumentType {
  id: ID!
  version: Int!
  slug: String!
  kind: String!
  category: String
  status: String!
  visibility: String!
  policy: [String!]
  readerIds: [ID!]
  title: String!
  frontmatter: JSON!
  authorId: ID!
  updatedAt: DateTime!
  deletedAt: DateTime
  deletedBy: ID
  effectiveBody: String
  canEditBody: Boolean!
  canEditMetadata: Boolean!
  author: DocumentAuthorType
  publishedAt: DateTime
  summaryDerived: SummaryDerivedType
}

type LieutenantAssignmentType {
  memberId: ID!
  npcDocumentId: ID!
  grantedAt: DateTime!
  grantedBy: ID
}

enum PreviewAudience {
  PLAYER
  DM
}

type SummaryDerivedType {
  authoring: SummaryAuthoringType
  quests: [SummaryQuestRefType!]!
  regions: [SummaryRegionType!]!
  pointcrawlNodes: [SummaryPointcrawlNodeType!]!
  dms: [SummaryDmType!]!
  players: [SummaryPlayerType!]!
  occurredAt: DateTime
  arc: String
  gameDay: Int
  gameDate: GameDateType
}

type SummaryAuthoringType {
  characterId: ID
  complete: Boolean!
  questIds: [ID!]!
}

type SummaryQuestRefType {
  id: ID!
  shortCode: String!
  title: String
}

type SummaryDmType {
  id: ID!
  displayName: String!
}

type SummaryPointcrawlNodeType {
  id: ID!
  mapId: ID!
  name: String
}

type SummaryPlayerType {
  characterId: ID!
  characterShortCode: String!
  characterName: String!
  memberId: ID!
  manual: Boolean!
}

type SummaryRegionType {
  id: ID!
  name: String!
}
