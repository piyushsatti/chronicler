type ArchonAssignmentType {
  memberId: ID!
  regionId: ID!
  grantedAt: DateTime!
  grantedBy: ID
}

type GameCalendarType {
  definition: JSON
  currentGameDay: Int
  currentGameDate: GameDateType
  monthGrid: [GameDayCellType!]!
}

type GameDateType {
  eraAbbrev: String!
  year: Int!
  periodName: String!
  periodIndex: Int!
  periodType: String!
  day: Int!
}

type MapType {
  id: ID!
  canEdit: Boolean!
  name: String!
  atlasCode: String!
  family: String!
  grid: String!
  mapKind: String!
  assetPath: String
  regionId: ID
  createdBy: ID
  createdAt: DateTime!
  pointcrawlNodes(limit: Int! = 200, offset: Int! = 0): [PointcrawlNodeType!]!
  pointcrawlEdges(limit: Int! = 200, offset: Int! = 0): [PointcrawlEdgeType!]!
}

type PointcrawlEdgeType {
  id: ID!
  mapId: ID!
  nodeA: ID!
  nodeB: ID!
  directed: Boolean!
  kind: String!
  label: String
  documentId: ID
}

type PointcrawlNodeType {
  id: ID!
  mapId: ID!
  x: Float!
  y: Float!
  name: String!
  linkedEntries(limit: Int! = 50, offset: Int! = 0): [PointcrawlEntryLinkType!]!
  submapId: ID
  createdAt: DateTime!
}

type RegionActivityType {
  regionId: ID!
  regionName: String!
  fillingCount: Int!
  scheduledCount: Int!
  liveCount: Int!
  openQuests: [RegionActivityQuestRefType!]!
  liveQuests: [RegionActivityQuestRefType!]!
}

type RegionCountsType {
  regionId: ID!
  questCount: Int!
  pointcrawlNodeCount: Int!
  featureCount: Int!
}

type RegionType {
  canCreateMap: Boolean!
  id: ID!
  name: String!
  kind: String!
  charterDeadline: DateTime
  documentId: ID
  createdAt: DateTime!
}

type TimeAnchorType {
  id: ID!
  realUtc: DateTime!
  epochDay: Int!
  rate: Float!
  note: String
}

type PointcrawlEntryLinkType {
  mapId: ID!
  nodeId: ID!
  documentId: ID!
  relation: String!
  createdAt: DateTime!
  createdBy: ID!
}
