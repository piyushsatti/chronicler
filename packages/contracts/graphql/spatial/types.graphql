type ArchonAssignmentType {
  memberId: ID!
  regionId: ID!
  grantedAt: DateTime!
  grantedBy: ID
}

type GameCalendarV2Type {
  definition: JSON
  currentGameDay: Int
  currentGameDate: GameDateV2Type
  monthGrid: [GameDayCellType!]!
}

type GameDateV2Type {
  eraAbbrev: String!
  year: Int!
  periodName: String!
  periodIndex: Int!
  periodType: String!
  day: Int!
}

type MapV2Type {
  id: ID!
  name: String!
  atlasCode: String!
  family: String!
  mapKind: String!
  assetPath: String
  regionId: ID
  createdBy: ID
  createdAt: DateTime!
  pointcrawlNodes(limit: Int! = 200, offset: Int! = 0): [PointcrawlNodeV2Type!]!
  pointcrawlEdges(limit: Int! = 200, offset: Int! = 0): [PointcrawlEdgeV2Type!]!
}

type PointcrawlEdgeV2Type {
  id: ID!
  mapId: ID!
  nodeA: ID!
  nodeB: ID!
  directed: Boolean!
  kind: String!
  label: String
  documentId: ID
}

type PointcrawlNodeV2Type {
  id: ID!
  mapId: ID!
  x: Float!
  y: Float!
  name: String!
  linkedEntries(limit: Int! = 50, offset: Int! = 0): [PointcrawlEntryLinkType!]!
  submapId: ID
  createdAt: DateTime!
}

type RegionActivityV2Type {
  regionId: ID!
  regionName: String!
  fillingCount: Int!
  scheduledCount: Int!
  liveCount: Int!
  openQuests: [RegionActivityQuestRefV2Type!]!
  liveQuests: [RegionActivityQuestRefV2Type!]!
}

type RegionCountsV2Type {
  regionId: ID!
  questCount: Int!
  pointcrawlNodeCount: Int!
  featureCount: Int!
}

type RegionV2Type {
  id: ID!
  name: String!
  kind: String!
  charterDeadline: DateTime
  documentId: ID
  createdAt: DateTime!
}

type TimeAnchorV2Type {
  id: ID!
  realUtc: DateTime!
  epochDay: Int!
  rate: Float!
  note: String
}

type PointcrawlEntryLinkType {
  mapId: ID!
  nodeId: ID!
  documentId: ID!
  relation: String!
  createdAt: DateTime!
  createdBy: ID!
}
