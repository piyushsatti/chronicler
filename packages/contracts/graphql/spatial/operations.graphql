extend type Query {
  map(atlasCode: String!): MapType
  maps(
    family: String = null
    mapKind: String = null
    limit: Int! = 50
    offset: Int! = 0
  ): [MapType!]!
  regions(kind: String = null, limit: Int! = 50, offset: Int! = 0): [RegionType!]!
  archonAssignments(
    regionId: ID
    memberId: ID
    limit: Int! = 50
    offset: Int! = 0
  ): ArchonPage!
  regionCounts(regionId: ID!): RegionCountsType
  regionActivity(atlasCode: String!): RegionActivityType
  gameDate(realDate: Date!): GameDateType
  realDates(gameDay: Int!, limit: Int! = 50, offset: Int! = 0): RealDatePage!
  timeAnchors(limit: Int! = 50, offset: Int! = 0): TimeAnchorPage!
  gameCalendar(realFrom: Date!, realTo: Date!): GameCalendarType!
}
extend type Mutation {
  createMap(input: MapCreateInput!, meta: CommandMeta!): MapType!
  createRegion(input: RegionInput!, meta: CommandMeta!): RegionType!
  updateRegion(id: ID!, input: RegionInput!, meta: CommandMeta!): RegionType!
  transitionRegion(
    id: ID!
    to: String!
    note: String!
    meta: CommandMeta!
  ): RegionType!
  assignArchon(memberId: ID!, regionId: ID!, meta: CommandMeta!): ArchonAssignmentType!
  revokeArchon(memberId: ID!, regionId: ID!, meta: CommandMeta!): CommandReceipt!
  createTimeAnchor(input: TimeAnchorInput!, meta: CommandMeta!): TimeAnchorType!
  updateTimeAnchor(
    id: ID!
    input: TimeAnchorInput!
    meta: CommandMeta!
  ): TimeAnchorType!
  updateGameCalendar(definition: JSON!, meta: CommandMeta!): GameCalendarType!
  deleteRegion(regionId: ID!, meta: CommandMeta!): CommandReceipt!
  restoreRegion(regionId: ID!, meta: CommandMeta!): RegionType!
  upsertPointcrawlNode(
    mapId: ID!
    input: PointcrawlNodeInput!
    meta: CommandMeta!
  ): PointcrawlNodeType!
  setPointcrawlEdge(
    mapId: ID!
    input: PointcrawlEdgeInput!
    meta: CommandMeta!
  ): PointcrawlEdgeType!
  linkPointcrawlEntry(
    mapId: ID!
    nodeId: ID!
    documentId: ID!
    relation: String!
    meta: CommandMeta!
  ): PointcrawlEntryLinkType!
  unlinkPointcrawlEntry(
    mapId: ID!
    nodeId: ID!
    documentId: ID!
    relation: String!
    meta: CommandMeta!
  ): CommandReceipt!
}

input PointcrawlNodeInput {
  id: ID
  x: Float!
  y: Float!
  name: String!
  submapId: ID
}
input PointcrawlEdgeInput {
  id: ID
  nodeA: ID!
  nodeB: ID!
  directed: Boolean!
  kind: String!
  label: String
  documentId: ID
}
