extend type Query {
  map(atlasCode: String!): MapV2Type
  maps(
    family: String = null
    mapKind: String = null
    limit: Int! = 50
    offset: Int! = 0
  ): [MapV2Type!]!
  regions(kind: String = null, limit: Int! = 50, offset: Int! = 0): [RegionV2Type!]!
  archonAssignments(
    regionId: ID
    memberId: ID
    limit: Int! = 50
    offset: Int! = 0
  ): ArchonPage!
  regionCounts(regionId: ID!): RegionCountsV2Type
  regionActivity(atlasCode: String!): RegionActivityV2Type
  gameDate(realDate: Date!): GameDateV2Type
  realDates(gameDay: Int!, limit: Int! = 50, offset: Int! = 0): RealDatePage!
  timeAnchors(limit: Int! = 50, offset: Int! = 0): TimeAnchorPage!
  gameCalendar(realFrom: Date!, realTo: Date!): GameCalendarV2Type!
}
extend type Mutation {
  createMap(input: MapCreateInput!, meta: CommandMeta!): MapV2Type!
  createRegion(input: RegionInput!, meta: CommandMeta!): RegionV2Type!
  updateRegion(id: ID!, input: RegionInput!, meta: CommandMeta!): RegionV2Type!
  transitionRegion(
    id: ID!
    to: String!
    note: String!
    meta: CommandMeta!
  ): RegionV2Type!
  assignArchon(memberId: ID!, regionId: ID!, meta: CommandMeta!): ArchonAssignmentType!
  revokeArchon(memberId: ID!, regionId: ID!, meta: CommandMeta!): CommandReceipt!
  createTimeAnchor(input: TimeAnchorInput!, meta: CommandMeta!): TimeAnchorV2Type!
  updateTimeAnchor(
    id: ID!
    input: TimeAnchorInput!
    meta: CommandMeta!
  ): TimeAnchorV2Type!
  updateGameCalendar(definition: JSON!, meta: CommandMeta!): GameCalendarV2Type!
  deleteRegion(regionId: ID!, meta: CommandMeta!): CommandReceipt!
  restoreRegion(regionId: ID!, meta: CommandMeta!): RegionV2Type!
  upsertPointcrawlNode(
    mapId: ID!
    input: PointcrawlNodeInput!
    meta: CommandMeta!
  ): PointcrawlNodeV2Type!
  setPointcrawlEdge(
    mapId: ID!
    input: PointcrawlEdgeInput!
    meta: CommandMeta!
  ): PointcrawlEdgeV2Type!
  linkPointcrawlEntry(
    mapId: ID!
    nodeId: ID!
    documentId: ID!
    relation: String!
    meta: CommandMeta!
  ): PointcrawlEntryLinkType!
  unlinkPointcrawlEntry(
    mapId: ID!
    nodeId: ID!
    documentId: ID!
    relation: String!
    meta: CommandMeta!
  ): CommandReceipt!
}

input PointcrawlNodeInput {
  id: ID
  x: Float!
  y: Float!
  name: String!
  submapId: ID
}
input PointcrawlEdgeInput {
  id: ID
  nodeA: ID!
  nodeB: ID!
  directed: Boolean!
  kind: String!
  label: String
  documentId: ID
}
