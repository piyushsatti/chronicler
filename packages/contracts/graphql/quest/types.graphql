input CreateQuestInput {
  title: String!
  regionIds: [ID!]!
  scheduledAt: DateTime!
  durationHours: Float!
  briefBody: String! = ""
  dmId: ID = null
  kinds: [String!]! = ["standard"]
  slotsMax: Int! = 4
  arcId: ID = null
  tags: [String!]! = []
  genres: [String!]! = []
  apl: Int = null
  signupType: String = null
  additionalInfo: String = null
  voiceChannelId: String = null
}

type OpenQuestSeatType {
  questId: ID!
  shortCode: String!
  dmId: ID!
  regionIds: [ID!]!
  scheduledAt: DateTime!
  status: String!
  slotsMax: Int!
  filledCount: Int!
  openSeats: Int!
}

type OpenQuestSeatsResult {
  entries: [OpenQuestSeatType!]!
  total: Int!
}

type DiscordVoiceChannelType {
  name: String!
  channelId: String!
}

type DiscordSettingsType {
  announceChannelId: String
  roleId: String
  voiceChannels: [DiscordVoiceChannelType!]!
}

type QuestAnnouncementRoleSettingType {
  enabled: Boolean!
  roleId: String
}

type QuestArcListResult {
  items: [QuestArcType!]!
  total: Int!
}

type QuestArcType {
  id: ID!
  name: String!
  createdBy: ID!
  createdAt: DateTime!
  quests(limit: Int! = 50, offset: Int! = 0): [QuestType!]!
  questCount: Int!
}

type QuestDiscordDeliveryType {
  jobId: ID
  desiredRevision: Int!
  appliedRevision: Int!
  overallStatus: String!
  messageState: String
  threadState: String
  eventState: String
  nextRetryAt: DateTime
  errorCode: String
  errorMessage: String
}

type QuestDmType {
  handle: String!
  displayName: String!
  avatarUrl: String
}

type QuestPointcrawlLinkType {
  questId: ID!
  pointcrawlNodeId: ID!
  role: String!
  name: String!
}

type QuestParticipantType {
  questId: ID!
  memberId: ID!
  characterId: ID!
  status: String!
  manual: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  characterName: String!
  memberHandle: String!
  memberDisplayName: String!
  memberAvatarUrl: String
  # Loaded only for last_game_played. Null there means this player has never played.
  lastPlayedAt: DateTime
}

type QuestStateCountType {
  state: String!
  count: Int!
}

input QuestStateCountsFiltersInput {
  kind: String = null
  dmId: ID = null
  regionId: ID = null
  arcId: ID = null
  tag: String = null
}

type QuestSummariesResult {
  summaries: [DocumentType!]!
  totals: QuestSummaryTotalsType!
}

type QuestSummaryTotalsType {
  totalPcxpAwarded: Int
  coverage: RewardCoverage!
}

input QuestFiltersInput {
  status: String = null
  kind: String = null
  dmId: ID = null
  regionId: ID = null
  arcId: ID = null
  tag: String = null
  genre: String = null
  shortCodes: [String!] = null
  search: String = null
  displayStatus: String = null
  scheduledFrom: DateTime = null
  scheduledTo: DateTime = null
}

type QuestListResult {
  items: [QuestType!]!
  total: Int!
}

type QuestType {
  id: ID!
  shortCode: String!
  kinds: [String!]!
  status: String!
  dmId: ID!
  arcId: ID
  scheduledAt: DateTime!
  durationHours: Float!
  slotsMax: Int!
  filledCount: Int!
  documentId: ID
  discordMessageId: String
  discordEventId: String
  eventUrl: String
  announceError: String
  tags: [String!]!
  genres: [String!]!
  apl: Int
  signupType: String
  voiceChannelId: String
  createdBy: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
  displayStatus: String
  dm: QuestDmType
  briefDocument: DocumentType
  participants(
    status: String = null
    limit: Int! = 100
    offset: Int! = 0
  ): [QuestParticipantType!]!
  pointcrawlLinks(
    role: String = null
    limit: Int! = 100
    offset: Int! = 0
  ): [QuestPointcrawlLinkType!]!
  arc: QuestArcType
  dmTable: DocumentType
  regions: [ID!]!
  discordDelivery: QuestDiscordDeliveryType!
}

type RegionActivityQuestRefType {
  id: ID!
  shortCode: String!
  scheduledAt: DateTime!
  slotsMax: Int!
  filledCount: Int!
}

enum RewardCoverage {
  COMPLETE
  LEGACY_UNKNOWN
}
