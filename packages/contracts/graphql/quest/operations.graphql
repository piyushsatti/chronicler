extend type Query {
  openQuestSeats(
    regionId: ID = null
    dmId: ID = null
    limit: Int! = 50
    offset: Int! = 0
  ): OpenQuestSeatsResult!
  quest(id: ID = null, shortCode: String = null): QuestType
  quests(
    filters: QuestFiltersInput = null
    limit: Int! = 50
    offset: Int! = 0
  ): QuestListResult!
  questBoard(regionId: ID = null, limit: Int! = 50, offset: Int! = 0): QuestListResult!
  recentlyClosedQuests(
    regionId: ID = null
    closedSince: DateTime = null
    limit: Int! = 50
    offset: Int! = 0
  ): QuestListResult!
  questArcs(limit: Int! = 50, offset: Int! = 0): QuestArcListResult!
  questArc(id: ID!): QuestArcType
  questGenreOptions: [String!]!
  myQuestSignups(limit: Int! = 50, offset: Int! = 0): ParticipationPage!
  questSummaries(
    questId: ID!
    limit: Int! = 50
    offset: Int! = 0
  ): QuestSummariesResult!
  questStateCounts(filters: QuestStateCountsFiltersInput): [QuestStateCountType!]!
  dmStats(memberId: ID!): DmStatsType
  dmSessionHistory(
    memberId: ID!
    limit: Int! = 50
    offset: Int! = 0
  ): DmSessionHistoryResult!
  dmSummaries(
    filters: DmSummaryFiltersInput
    limit: Int! = 50
    offset: Int! = 0
  ): DocumentListResult!
}
extend type Mutation {
  createQuest(input: CreateQuestInput!, meta: CommandMeta!): QuestType!
  updateQuest(id: ID!, input: QuestEditInput!, meta: CommandMeta!): QuestType!
  transitionQuestStatus(id: ID!, to: String!, meta: CommandMeta!): QuestType!
  closeQuest(id: ID!, input: CloseQuestInput!, meta: CommandMeta!): QuestType!
  upsertQuestSummary(input: QuestSummaryInput!, meta: CommandMeta!): DocumentType!
  upsertQuestArc(id: ID, name: String!, meta: CommandMeta!): QuestArcType!
  removeQuestFromArc(questId: ID!, meta: CommandMeta!): QuestType!
  signupForQuest(
    questId: ID!
    characterId: ID!
    meta: CommandMeta!
  ): QuestParticipantType!
  withdrawFromQuest(
    questId: ID!
    characterId: ID!
    meta: CommandMeta!
  ): QuestParticipantType!
  addQuestParticipant(
    questId: ID!
    characterId: ID!
    meta: CommandMeta!
  ): QuestParticipantType!
  removeQuestParticipant(
    questId: ID!
    characterId: ID!
    meta: CommandMeta!
  ): QuestParticipantType!
  selectQuestParticipants(
    questId: ID!
    characterIds: [ID!]!
    meta: CommandMeta!
  ): [QuestParticipantType!]!
  attestQuestParticipation(
    questId: ID!
    entries: [ParticipationAttestationInput!]!
    meta: CommandMeta!
  ): [QuestParticipantType!]!
  syncQuestDiscord(questId: ID!, meta: CommandMeta!): DeliveryReceipt!
  deleteQuest(questId: ID!, meta: CommandMeta!): CommandReceipt!
  restoreQuest(questId: ID!, meta: CommandMeta!): QuestType!
  setQuestPointcrawlLinks(
    questId: ID!
    links: [QuestPointcrawlLinkInput!]!
    meta: CommandMeta!
  ): [QuestPointcrawlLinkType!]!
}

input CloseQuestInput {
  attendance: [ParticipationAttestationInput!]!
  rewards: [QuestPcxpAwardInput!]!
}
input QuestPcxpAwardInput {
  characterId: ID!
  pcxp: Int!
  note: String
}
