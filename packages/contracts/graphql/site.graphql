type AdminDeliveryConfigV2Type {
  publicOrigin: String!
  publicOriginHealthy: Boolean!
  deliveryMode: String!
  announcementRoleId: String
  announcementRoleSource: String!
  announcementRoleHealthy: Boolean!
}

type AdminDeliveryJobV2Type {
  id: ID!
  questId: ID
  questShortCode: String
  questTitle: String
  questLink: String
  eventLink: String
  messageId: String
  state: String!
  desiredRevision: Int
  appliedRevision: Int
  failureStreak: Int!
  maxAttempts: Int!
  nextAttemptAt: DateTime!
  safeError: String
  historicalRoleNotificationMissed: Boolean!
  redriveCount: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type AdminHealthAlertV2Type {
  key: String!
  label: String!
  severity: String!
  remediationHref: String!
  firstSeenAt: DateTime
  lastSeenAt: DateTime
}

type AdminOperationsV2Type {
  config: AdminDeliveryConfigV2Type!
  activeAlertCount: Int!
  pendingDeliveryCount: Int!
  terminalDeliveryCount: Int!
  deliveryTotal: Int!
  deliveries: [AdminDeliveryJobV2Type!]!
  activeAlerts: [AdminHealthAlertV2Type!]!
}

type CategoryCountType {
  category: String!
  count: Int!
}

type ChannelVoiceMinutesType {
  channelId: String!
  minutes: Int!
}

type CountByKeyType {
  key: String!
  count: Int!
}

type DmLastSessionV2Type {
  quest: QuestV2Type!
  recapDocument: DocumentType
}

type DmSessionHistoryV2Result {
  items: [DmLastSessionV2Type!]!
  total: Int!
}

type DmStatsV2Type {
  sessionCount: Int!
