type AdminDeliveryConfigType {
  publicOrigin: String!
  publicOriginHealthy: Boolean
  deliveryMode: String!
  announcementRoleId: String
  announcementRoleSource: String!
  announcementRoleHealthy: Boolean
}

type AdminDeliveryJobType {
  id: ID!
  questId: ID
  questShortCode: String
  questTitle: String
  questLink: String
  eventLink: String
  messageId: String
  state: String!
  desiredRevision: Int
  appliedRevision: Int
  failureStreak: Int!
  maxAttempts: Int!
  nextAttemptAt: DateTime!
  safeError: String
  redriveCount: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type AdminHealthAlertType {
  key: String!
  label: String!
  severity: String!
  remediationHref: String!
  firstSeenAt: DateTime
  lastSeenAt: DateTime
}

type AdminOperationsType {
  scheduledWork: [ScheduledWorkStatusType!]!
  config: AdminDeliveryConfigType!
  activeAlertCount: Int!
  pendingDeliveryCount: Int!
  terminalDeliveryCount: Int!
  deliveryTotal: Int!
  deliveries: [AdminDeliveryJobType!]!
  activeAlerts(limit: Int! = 50, offset: Int! = 0): [AdminHealthAlertType!]!
}

type CategoryCountType {
  category: String!
  count: Int!
}

type ChannelVoiceMinutesType {
  channelId: String!
  minutes: Float!
}

type CountByKeyType {
  key: String!
  count: Int!
}

type DmLastSessionType {
  quest: QuestType!
  recapDocument: DocumentType
}

type DmSessionHistoryResult {
  items: [DmLastSessionType!]!
  total: Int!
}

type DmStatsType {
  sessionCount: Int!
  lastSession: DmLastSessionType
}

input DmSummaryFiltersInput {
  questId: ID = null
  search: String = null
}

type GameDayCellType {
  realDate: Date!
  gameDay: Int
  gameDate: GameDateType
}

type HomeBannerType {
  enabled: Boolean!
  title: String
  body: String
  ctaLabel: String
  ctaHref: String
  mediaKind: String
  mediaUrl: String
  mediaLabel: String
}

type HomeBucketType {
  category: String
  documents: [DocumentType!]!
}

type HomeType {
  recentByCategory: [HomeBucketType!]!
  communityStats: SiteStatsType!
}

type SearchKindType {
  key: String!
  label: String!
  searchable: Boolean!
  exclusionReason: String
}

type SearchResultType {
  query: String!
  documents: [DocumentSearchHitType!]!
  documentTotal: Int!
  documentOrder: String!
  members: [MemberSearchHitType!]!
  memberTotal: Int!
  memberOrder: String!
}

type SiteStatsType {
  totalMembers: Int!
  membersByRole: [CountByKeyType!]!
  activeCharacters: Int!
  totalMaps: Int!
  totalRegions: Int!
  totalQuests: Int!
  totalDms: Int!
  activity: ActivitySummaryType!
}

type ScheduledWorkStatusType {
  kind: String!
  expectedSlot: DateTime!
  outcome: String!
  lastStartedAt: DateTime
  lastFinishedAt: DateTime
  jobId: ID
  safeErrorCode: String
}
