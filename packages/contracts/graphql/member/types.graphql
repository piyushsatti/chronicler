type ActivityEventType {
  kind: String!
  channelId: String!
  occurredAt: DateTime!
  amount: Float!
}

type ActivitySummaryType {
  voiceMinutes: Float!
  messages: Float!
  reactions: Float!
}

input AvailabilitySlotInput {
  day: String!
  startTime: Time!
  endTime: Time!
  note: String = null
}

type AvailabilitySlotType {
  day: String!
  startTime: Time!
  endTime: Time!
  note: String
}

input CommunityDirectoryFiltersInput {
  role: String = null
  acceptingPlayers: Boolean = null
  search: String = null
  dmProfileStatus: String = null
}

type CommunityDirectoryResult {
  entries: [DirectoryEntryType!]!
  total: Int!
}

type DirectoryEntryType {
  memberId: ID!
  handle: String!
  displayName: String!
  avatarUrl: String
  roles: [String!]!
  status: String!
  isDm: Boolean!
  tagline: String
  acceptingPlayers: Boolean
  dmProfileStatus: String
  dmProfileReviewRevision: Int
  tableInfo: JSON
  availableDays: [String!]!
}

type DmProfileType {
  memberId: ID!
  tagline: String
  philosophy: String
  houseRules: String
  tableInfo: JSON
  acceptingPlayers: Boolean!
  status: String!
  reviewRevision: Int!
}

type DriverProgressType {
  tenureMonths: Int!
  playerQuestsCount: Int!
  dmSessionsCount: Int!
}

type MemberActivityStatsType {
  voiceMinutes: Float!
  messages: Float!
  questsPlayed: Int!
  longestSessionHours: Float
  summariesAuthored: Int!
  lastMessageAt: DateTime
  voiceByChannel(limit: Int! = 50, offset: Int! = 0): [ChannelVoiceMinutesType!]!
  recentSessions(limit: Int! = 20, offset: Int! = 0): [ActivityEventType!]!
}

input MemberFiltersInput {
  role: String = null
  status: String = null
  search: String = null
}

type MemberListResult {
  items: [MemberType!]!
  total: Int!
}

type MemberProfileType {
  member: MemberType!
  dmProfile: DmProfileType
  availability: [AvailabilitySlotType!]!
  activitySummary: ActivitySummaryType!
  recentWeeks(limit: Int! = 12, offset: Int! = 0): [WeekActivityType!]!
}

input MemberRoleBatchInput {
  memberId: ID!
  roles: [String!]!
  note: String = null
}

type MemberRoleBatchResultType {
  memberId: ID!
  ok: Boolean!
  error: String
  member: MemberType
}

type MemberSearchHitType {
  memberId: ID!
  handle: String!
  displayName: String!
  avatarUrl: String
}

enum Theme {
  PARCHMENT
  MIDNIGHT
  EMBER
  DRACULA
  VEGAN
}
enum ColorMode {
  LIGHT
  DARK
  SYSTEM
}
enum Density {
  COMFORTABLE
  COMPACT
}
type MemberSettingsType {
  memberId: ID!
  theme: Theme!
  mode: ColorMode!
  effectsEnabled: Boolean!
  colorblindSafe: Boolean!
  reducedMotion: Boolean!
  density: Density!
  timezone: String
  updatedAt: DateTime
  notifyCharacterVerification: Boolean!
  notifyQuestSignup: Boolean!
  notifyDocumentActivity: Boolean!
  notifyQuestScheduled: Boolean!
  notifyDmMentioned: Boolean!
}

enum MemberSortInput {
  HANDLE
  JOINED_AT_ASC
  JOINED_AT_DESC
}

type MemberType {
  id: ID!
  handle: String!
  displayName: String!
  avatarUrl: String
  roles: [String!]!
  status: String!
  joinedAt: DateTime!
  discordId: String
}

type MemberUnlockType {
  memberId: ID!
  unlockableId: ID!
  unlockedAt: DateTime!
  source: String!
  grantedBy: ID
}

type MyPersonalizationType {
  settings: MemberSettingsType
}

type RoleChangeType {
  id: ID!
  memberId: ID!
  oldRoles: [String!]!
  newRoles: [String!]!
  changedBy: ID!
  occurredAt: DateTime!
  note: String
}

enum UnlockKind {
  ACHIEVEMENT
  DM_TIER
}
type UnlockableType {
  id: ID!
  kind: UnlockKind!
  name: String!
  description: String
  payload: JSON!
  unlockRule: JSON
  active: Boolean!
}

input UpsertUnlockableInput {
  kind: UnlockKind!
  name: String!
  payload: JSON!
  description: String = null
  unlockRule: JSON = null
  active: Boolean! = true
}

type WeekActivityType {
  periodStart: Date!
  voiceMinutes: Float!
  messages: Float!
  reactions: Float!
}

type MemberUnlockPage {
  items: [MemberUnlockType!]!
  total: Int!
  driverProgress: DriverProgressType!
  unlockedAchievements: [String!]!
  dmTier: String!
}
