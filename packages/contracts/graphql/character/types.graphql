type AdminCharacterDirectoryEntryType {
  id: ID!
  shortCode: String!
  name: String!
  ownerId: ID!
  ownerHandle: String!
  ownerDisplayName: String!
  ownerAvatarUrl: String
  regionId: ID
  regionName: String
  guildId: ID
  status: String!
  verificationStatus: String!
  verificationSubmittedAt: DateTime
  ddbUrl: String
  "Mirror time of the last successful D&D Beyond sync. Older than verificationSubmittedAt means that sync failed and the sheet is stale."
  ddbSyncedAt: DateTime
  updatedAt: DateTime!
}

input AdminCharacterDirectoryFiltersInput {
  namePrefix: String = null
  regionId: ID = null
  status: String = null
}

type AdminCharacterDirectoryType {
  items: [AdminCharacterDirectoryEntryType!]!
  total: Int!
}

input BackstoryFiltersInput {
  cohort: String = null
  regionId: ID = null
  includeRetired: Boolean! = false
}

type BackstoryType {
  id: ID!
  name: String!
  lore: String!
  cohort: String!
  sourceRegionId: ID
  retired: Boolean!
}

type CharacterDDBMirrorType {
  characterId: ID!
  level: Int
  xp: Int
  armorClass: Int
  maxHp: Int
  species: String
  classes: String
  background: String
  syncedAt: DateTime
}

type CharacterLogListResult {
  items: [CharacterLogType!]!
  total: Int!
}

type CharacterLogType {
  id: ID!
  characterId: ID!
  body: String!
  questId: ID
  createdBy: ID
  createdAt: DateTime!
}

enum CharacterReviewStatus {
  PENDING
  REJECTED
  APPROVED
  UNKNOWN
}

input CharacterFiltersInput {
  ownerId: ID = null
  guildId: ID = null
  regionId: ID = null
  namePrefix: String = null
  status: String = null
}

type CharacterListResult {
  items: [CharacterType!]!
  total: Int!
}

type CharacterType {
  id: ID!
  ownerId: ID!
  shortCode: String!
  name: String!
  status: String!
  regionId: ID
  guildId: ID
  backstoryId: ID
  pcxp: Int!
  description: String
  backgroundText: String
  ddbUrl: String
  createdAt: DateTime!
  updatedAt: DateTime!
  verificationSubmittedAt: DateTime
  verificationStatus: CharacterReviewStatus!
  ddbLastAttempt: DdbAttemptType
  ddbMirror: CharacterDDBMirrorType
  proficiencies: [DDBProficiencyType!]!
  displayIcon: String
  "Owner-supplied https portrait URL (D5); null shows the initials token."
  imageUrl: String
  daysActive: Int!
}

type CoPlayerType {
  characterId: ID!
  memberId: ID!
  questCount: Int!
}

input CreateCharacterInput {
  name: String!
  regionId: ID
  backstoryId: ID
  catalogPickIds: [ID!]! = []
  guildId: ID = null
  description: String = null
  backgroundText: String = null
  "Required on create (D4): a https://www.dndbeyond.com/characters/<id> sheet URL."
  ddbUrl: String = null
  "Optional https URL, at most 2048 characters."
  imageUrl: String = null
  shortCode: String = null
}

type CreationCatalogEntryType {
  id: ID!
  kind: String!
  name: String!
  description: String
  available: Boolean!
  retired: Boolean!
  introducedByRegionId: ID
}

input CreationCatalogFiltersInput {
  kind: String = null
  regionId: ID = null
  includeAll: Boolean! = false
}

type DDBProficiencyType {
  kind: String!
  name: String!
}

type DowntimeProjectListResult {
  items: [DowntimeProjectType!]!
  total: Int!
}

type DowntimeProjectType {
  id: ID!
  characterId: ID!
  name: String!
  goal: String
  progress: Int!
  target: Int
  status: String!
  notes: String
  updatedAt: DateTime!
}

type ProgressionEntryType {
  id: ID!
  characterId: ID!
  kind: String!
  amount: Int
  questId: ID
  note: String
  recordedBy: ID
  recordedAt: DateTime!
}

type ProgressionListResult {
  items: [ProgressionEntryType!]!
  total: Int!
}

input UpdateCharacterProfileInput {
  description: String
  backgroundText: String
  "Omit to keep, null to clear, or an https URL of at most 2048 characters."
  imageUrl: String
}

input UpsertCreationCatalogEntryInput {
  kind: String!
  name: String!
  optionId: ID = null
  description: String = null
  available: Boolean! = false
  retired: Boolean! = false
  introducedByRegionId: ID = null
}

type VerificationType {
  id: ID!
  targetType: String!
  targetId: ID!
  verdict: String!
  note: String
  verifiedBy: ID!
  recordedAt: DateTime!
}

type DdbAttemptType {
  id: ID!
  attemptedAt: DateTime!
  finishedAt: DateTime!
  succeeded: Boolean!
  safeError: String
  provenance: JSON!
}
