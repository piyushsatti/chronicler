# Release stack for staging and production, deployed only via GitHub Actions
# (D33, D51). Do not run this file by hand against a production host; local use
# (e.g. a Triton rehearsal) is for validating the stack with throwaway data.
#
# Containers: chronicler-api (HTTP API + background-job worker in one process),
# chronicler-discord-bot, and two optional pieces chosen by Compose profiles:
#   local-db  chronicler-postgres, the Compose-managed PostgreSQL (staging).
#             Without it the API needs DATABASE_URL (hosted PostgreSQL, i.e.
#             Supabase in production).
#   tunnel    chronicler-cloudflared, the Cloudflare Tunnel connector that
#             publishes the API (production). The VM has no inbound ports.
#             Staging uses a tunnel on its host instead and leaves this off.
# Select profiles with COMPOSE_PROFILES (the deploy workflow does).
#
# Compose interpolates every service, including ones in inactive profiles, so
# `:?` cannot guard a variable that only one mode needs. Mode-specific values
# are checked by the deploy workflow; `:?` below covers what both modes need.
#
# Migrations are not a container and never run at boot. Apply them explicitly:
#   docker compose -f deploy/compose.production.yaml run --rm chronicler-api migrate
#   docker compose -f deploy/compose.production.yaml run --rm chronicler-api migrate status
#
# Images come from ${API_IMAGE} / ${DISCORD_IMAGE} (GHCR). For a local run
# without GHCR, leave them unset and add `--build`: the build contexts below
# point at this repository.
name: chronicler-production

services:
  chronicler-postgres:
    image: postgres:16-alpine
    profiles: ['local-db']
    # Not `:?`: see the header. The image refuses to initialise without
    # POSTGRES_PASSWORD, and the API's local URL is built from the same three
    # variables.
    environment:
      POSTGRES_USER: ${POSTGRES_USER-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD-}
      POSTGRES_DB: ${POSTGRES_DB-}
    volumes:
      - chronicler_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  chronicler-api:
    image: ${API_IMAGE:-chronicler-api:local}
    build:
      context: ../apps/api
    environment:
      CHRONICLER_ENV: production
      API_ADDR: ':8080'
      # DATABASE_URL (hosted PostgreSQL) wins; otherwise the local-db URL.
      # pgxpool reads pool_max_conns; libpq tools reject it (see scripts/backup-db).
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER-}:${POSTGRES_PASSWORD-}@chronicler-postgres:5432/${POSTGRES_DB-}?sslmode=disable&pool_max_conns=10}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      INGEST_SECRET: ${INGEST_SECRET:?set INGEST_SECRET}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      PLATFORM_OWNER_MEMBER_ID: ${PLATFORM_OWNER_MEMBER_ID:-}
      PLATFORM_OWNER_DISCORD_ID: ${PLATFORM_OWNER_DISCORD_ID:-}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-}
      # Background-job worker (runs inside this process): Discord REST delivery.
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_ANNOUNCE_CHANNEL_ID: ${DISCORD_ANNOUNCE_CHANNEL_ID:-}
      GUILD_ID: ${GUILD_ID:-}
    stop_grace_period: 30s
    ports:
      - '127.0.0.1:${API_PORT:-8080}:8080'
    depends_on:
      chronicler-postgres:
        condition: service_healthy
        # Absent unless the local-db profile is on (hosted database).
        required: false
    healthcheck:
      test: ['CMD', '/api', 'healthcheck']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  chronicler-discord-bot:
    image: ${DISCORD_IMAGE:-chronicler-discord:local}
    build:
      context: ..
      dockerfile: apps/discord/Dockerfile
    environment:
      BOT_DISCORD_TOKEN: ${BOT_DISCORD_TOKEN:?set BOT_DISCORD_TOKEN}
      GUILD_ID: ${GUILD_ID:?set GUILD_ID}
      INGEST_SECRET: ${INGEST_SECRET:?set INGEST_SECRET}
      # Container-network traffic only; the bot refuses http unless allowed.
      API_URL: http://chronicler-api:8080
      BOT_API_ALLOWED_ORIGIN: http://chronicler-api:8080
      BOT_ALLOW_INSECURE_API_URL: 'true'
      AGENT_ENABLED: 'false'
      SNIFFER_ENABLED: ${SNIFFER_ENABLED:-}
      BOT_HEARTBEAT_ENABLED: ${BOT_HEARTBEAT_ENABLED:-}
    depends_on:
      chronicler-api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'bun', 'apps/discord/dist/healthcheck.js']
      interval: 30s
      start_period: 90s
      retries: 3
    restart: unless-stopped

  # Production ingress (profile `tunnel`): dials out to Cloudflare, which
  # terminates TLS for the public hostname and forwards over this network. The
  # tunnel is remotely managed; its public hostname (API_DOMAIN) must route
  # to http://chronicler-api:8080 in Cloudflare. TUNNEL_TOKEN is what
  # `cloudflared tunnel run` reads; the CLOUDFLARE_TUNNEL_TOKEN secret feeds it.
  chronicler-cloudflared:
    # 2026.10.2 is the minimum after Cloudflare's 2026-10-20 eMudhra advisory.
    image: cloudflare/cloudflared:2026.10.2
    profiles: ['tunnel']
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN-}
    depends_on:
      chronicler-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chronicler_pg_data:
