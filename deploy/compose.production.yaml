# Production: deployed only via GitHub Actions (D33). Do not run this file by
# hand against a production host; local use (e.g. a Triton rehearsal) is for
# validating the stack with throwaway data.
#
# Containers: chronicler-postgres, chronicler-api (HTTP API + background-job
# worker in one process), chronicler-discord-bot, and chronicler-caddy (TLS
# reverse proxy, enabled only with `--profile tls`, i.e. on the droplet).
#
# Migrations are not a container and never run at boot. Apply them explicitly:
#   docker compose -f deploy/compose.production.yaml run --rm chronicler-api migrate
#   docker compose -f deploy/compose.production.yaml run --rm chronicler-api migrate status
#
# Images come from ${API_IMAGE} / ${DISCORD_IMAGE} (GHCR). For a local run
# without GHCR, leave them unset and add `--build`: the build contexts below
# point at this repository.
name: chronicler-production

services:
  chronicler-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - chronicler_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  chronicler-api:
    image: ${API_IMAGE:-chronicler-api:local}
    build:
      context: ../apps/api
    environment:
      CHRONICLER_ENV: production
      API_ADDR: ':8080'
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@chronicler-postgres:5432/${POSTGRES_DB}?sslmode=disable&pool_max_conns=10
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      INGEST_SECRET: ${INGEST_SECRET:?set INGEST_SECRET}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      PLATFORM_OWNER_MEMBER_ID: ${PLATFORM_OWNER_MEMBER_ID:-}
      PLATFORM_OWNER_DISCORD_ID: ${PLATFORM_OWNER_DISCORD_ID:-}
      OPERATOR_DISCORD_WEBHOOK_URL: ${OPERATOR_DISCORD_WEBHOOK_URL:-}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-}
      # Background-job worker (runs inside this process): Discord REST delivery.
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_ANNOUNCE_CHANNEL_ID: ${DISCORD_ANNOUNCE_CHANNEL_ID:-}
      GUILD_ID: ${GUILD_ID:-}
      DISCORD_DELIVERY_DRY_RUN: ${DISCORD_DELIVERY_DRY_RUN:-}
      AGENT_INLINE_COMPLETE: ${AGENT_INLINE_COMPLETE:-}
    stop_grace_period: 30s
    ports:
      - '127.0.0.1:${API_PORT:-8080}:8080'
    depends_on:
      chronicler-postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', '/api', 'healthcheck']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  chronicler-discord-bot:
    image: ${DISCORD_IMAGE:-chronicler-discord:local}
    build:
      context: ..
      dockerfile: apps/discord/Dockerfile
    environment:
      BOT_DISCORD_TOKEN: ${BOT_DISCORD_TOKEN:?set BOT_DISCORD_TOKEN}
      BOT_CLIENT_ID: ${BOT_CLIENT_ID:?set BOT_CLIENT_ID}
      GUILD_ID: ${GUILD_ID:?set GUILD_ID}
      INGEST_SECRET: ${INGEST_SECRET:?set INGEST_SECRET}
      # Container-network traffic only; the bot refuses http unless allowed.
      API_URL: http://chronicler-api:8080
      BOT_API_ALLOWED_ORIGIN: http://chronicler-api:8080
      BOT_ALLOW_INSECURE_API_URL: 'true'
      AGENT_ENABLED: 'false'
      SNIFFER_ENABLED: ${SNIFFER_ENABLED:-}
      BOT_HEARTBEAT_ENABLED: ${BOT_HEARTBEAT_ENABLED:-}
    depends_on:
      chronicler-api:
        condition: service_healthy
    restart: unless-stopped

  # Droplet only: `docker compose --profile tls up -d`. Automatic Let's Encrypt
  # for ${API_DOMAIN}; DNS must point at the droplet and 80/443 must be open.
  chronicler-caddy:
    image: caddy:2-alpine
    profiles: ['tls']
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      chronicler-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chronicler_pg_data:
  caddy_data:
  caddy_config:
