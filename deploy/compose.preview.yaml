# Preview stack: rebuild from migrations and seed on each PR.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chronicler
      POSTGRES_PASSWORD: chronicler
      POSTGRES_DB: chronicler
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chronicler']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../apps/api
    environment:
      API_ADDR: ':8080'
      DATABASE_URL: postgres://chronicler:chronicler@postgres:5432/chronicler?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-preview-secret}
      DISCORD_CLIENT_SECRET: dev
      INGEST_SECRET: ${INGEST_SECRET:-preview-ingest}
      CORS_ORIGINS: '*'
    depends_on:
      postgres:
        condition: service_healthy
